name: Collect, test and publish V2Ray configs

on:
  schedule:
    - cron: "17 */3 * * *"        # every 3 hours (minute 17 avoids the busy top-of-hour queue)
  workflow_dispatch:               # manual run from the Actions tab
    inputs:
      max_configs:
        description: "Max configs to test (blank = config.yaml default)"
        required: false
        default: ""
      messages_per_channel:
        description: "Messages to read per channel (blank = config.yaml default)"
        required: false
        default: ""

permissions:
  contents: write                  # needed to commit the result files back

concurrency:                       # never let two runs push at the same time
  group: v2ray-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60            # hard stop; the pipeline's own budget is testing.max_runtime_minutes

    env:
      V2S_PROFILE: ci              # selects profiles.ci in config.yaml
      PYTHONUNBUFFERED: "1"
      # Optional Telethon credentials (Settings -> Secrets and variables -> Actions)
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      # Optional manual-run overrides (empty values are ignored by the config loader)
      V2S__testing__max_configs: ${{ github.event.inputs.max_configs }}
      V2S__scraper__messages_per_channel: ${{ github.event.inputs.messages_per_channel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Telethon (only when credentials are configured)
        if: env.TELEGRAM_SESSION != ''
        run: |
          pip install telethon
          echo "V2S__scraper__mode=both" >> "$GITHUB_ENV"

      - name: Download sing-box
        env:
          GITHUB_TOKEN: ${{ github.token }}    # avoids API rate limits when resolving "latest"
        run: python -m src.core_installer

      - name: Run pipeline
        run: python -m src.pipeline

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in raw_links.txt sorted_by_ping.txt sorted_by_speed.txt \
                   sub_ping_base64.txt sub_speed_base64.txt results.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update configs $(date -u +'%Y-%m-%d %H:%M UTC')"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              echo "push failed (attempt $attempt), retrying..."; sleep 5
            done
          fi
